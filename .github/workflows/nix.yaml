name: "Nix flake check"
on:
  pull_request:
  push:
    branches:
    - "main"
    - "feat-*"
    - "feature/*"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix run nixpkgs#omnix -- ci
